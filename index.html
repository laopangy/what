<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿潘阿潘潘的工具栈</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b1120;
    --surface: #111827;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.25);
    --green: #22c55e;
    --amber: #f59e0b;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99, 102, 241, 0.08), transparent),
      radial-gradient(ellipse 40% 50% at 20% 80%, rgba(34, 197, 94, 0.04), transparent),
      radial-gradient(ellipse 40% 50% at 80% 80%, rgba(245, 158, 11, 0.04), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 960px;
    padding: 60px 24px 80px;
  }

  .header {
    text-align: center;
    margin-bottom: 56px;
  }

  .header h1 {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, #e2e8f0 0%, #a5b4fc 50%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header p {
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 1.05rem;
  }

  .modules {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px 28px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    overflow: hidden;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 32px var(--accent-glow);
  }

  .card.disabled {
    opacity: 0.45;
    cursor: not-allowed;
    filter: grayscale(0.6);
  }

  .card.disabled:hover {
    transform: none;
    border-color: var(--border);
    box-shadow: none;
  }

  .card.primary {
    grid-column: 1 / -1;
    max-width: 280px;
    justify-self: center;
    border-color: var(--accent);
    box-shadow: 0 4px 24px var(--accent-glow);
  }

  .card.primary:hover {
    box-shadow: 0 12px 40px var(--accent-glow);
  }

  .icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
  }

  .icon.workbench { background: rgba(99, 102, 241, 0.2); }
  .icon.music     { background: rgba(99, 102, 241, 0.15); }
  .icon.cycling   { background: rgba(34, 197, 94, 0.12); }
  .icon.fitness   { background: rgba(239, 68, 68, 0.12); }
  .icon.travel    { background: rgba(245, 158, 11, 0.12); }

  .card h3 {
    font-size: 1.15rem;
    font-weight: 600;
  }

  .badge {
    font-size: 0.75rem;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .badge.active { background: rgba(34, 197, 94, 0.15); color: var(--green); }
  .badge.soon   { background: rgba(100, 116, 139, 0.15); color: var(--text-muted); }

  .footer {
    margin-top: 56px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .card:not(.disabled)::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .card:not(.disabled):hover::after {
    opacity: 1;
  }

  .divider {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    margin: 8px 0 -4px;
  }
</style>
</head>
<body>

<div class="container">

  <header class="header">
    <h1>阿潘阿潘潘的工具栈</h1>
    <p>一个汇集音乐、运动与生活的个人工具箱</p>
  </header>

  <div class="modules">

    <a class="card primary" href="http://localhost:5174">
      <div class="icon workbench">⚡</div>
      <h3>工作台</h3>
      <span class="badge active">AI 主入口</span>
    </a>

    <div class="divider">— 功能模块 —</div>

    <a class="card" href="Music/client/dist/index.html">
      <div class="icon music">🎵</div>
      <h3>音乐</h3>
      <span class="badge active">已上线</span>
    </a>

    <a class="card" href="http://localhost:5175">
      <div class="icon cycling">🔧</div>
      <h3>工具</h3>
      <span class="badge active">已上线</span>
    </a>

    <div class="card disabled">
      <div class="icon cycling">🚴</div>
      <h3>骑行</h3>
      <span class="badge soon">敬请期待</span>
    </div>

    <div class="card disabled">
      <div class="icon fitness">💪</div>
      <h3>健身</h3>
      <span class="badge soon">敬请期待</span>
    </div>

    <div class="card disabled">
      <div class="icon travel">✈️</div>
      <h3>旅游</h3>
      <span class="badge soon">敬请期待</span>
    </div>

  </div>

  <p class="footer">更多模块开发中...</p>
</div>

</body>
</html>
